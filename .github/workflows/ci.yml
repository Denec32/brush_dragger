name: CI

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      # Same Qt build and MinGW toolchain as local dev (see CLAUDE.md):
      # Qt 6.11.3 mingw_64 + MinGW 13.1 (MSVCRT), not the runner's own GCC.
      - name: Install Qt 6.11.3 and MinGW 13.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true
          # aqtinstall 3.3.0 (latest release) predates the Qt 6.11 repo layout
          # change. Use the merge commit of miurahr/aqtinstall#1000, which adds
          # 6.11 support. Switch back to a release once one newer than 3.3.0 ships.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      # Prepend Qt's MinGW so it wins over any GCC preinstalled on the runner.
      - name: Put MinGW 13.1 on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:IQTA_TOOLS\mingw1310_64\bin"

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_CXX_COMPILER="$env:IQTA_TOOLS/mingw1310_64/bin/g++.exe"
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/build/bin"

      # The POST_BUILD windeployqt step copies Qt DLLs, plugins and the MinGW
      # runtime next to the exe, so build/bin is a runnable app.
      - name: Build
        run: cmake --build build

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: brush_dragger-windows-${{ github.sha }}
          path: build/bin/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      # Headers Qt6Gui's CMake config looks for (OpenGL, EGL, xkbcommon,
      # Vulkan, fontconfig); the Qt binaries themselves come from aqt below.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libvulkan-dev libfontconfig1-dev

      - name: Install Qt 6.11.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          # Same pinned aqtinstall commit as the Windows job (Qt 6.11 support).
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      # Uses the runner's GCC 13, which has full C++20 support.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/build/bin"

      - name: Build
        run: cmake --build build

      # No deploy step on Linux: the binary needs Qt 6.11 at runtime.
      # Tar it so the executable bit survives upload-artifact.
      - name: Package app
        run: tar -czf brush_dragger-linux.tar.gz -C build/bin brush_dragger

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: brush_dragger-linux-${{ github.sha }}
          path: brush_dragger-linux.tar.gz
          if-no-files-found: error
